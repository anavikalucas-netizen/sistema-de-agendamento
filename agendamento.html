<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta - Agenda Cidade</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

    <header>
        <h1>Agenda Cidade</h1>
        <p>Sistema de Agendamento de Consultas</p>
    </header>

    <main>
        <section>
            <h2>Agendar consulta</h2>

            <form>
                <label for="medico">Médico:</label>
                <select id="medico">
                    <option>Dr. João Silva - Clínico Geral</option>
                    <option>Dra. Maria Santos - Cardiologia</option>
                </select>

                <label for="data">Data:</label>
                <input type="date" id="data">

                <label for="horario">Horário:</label>
                <select id="horario">
                    <option>08:00</option>
                    <option>09:00</option>
                    <option>10:00</option>
                    <option>14:00</option>
                    <option>15:00</option>
                    <option>16:00</option>
                </select>

                <button type="submit">Confirmar agendamento</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Agenda Cidade</p>
    </footer>

</body>
</html>
