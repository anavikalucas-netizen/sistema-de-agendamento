<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta - Agenda Cidade</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

    <header>
        <h1>Agenda Cidade</h1>
        <p>Sistema de Agendamento de Consultas</p>
    </header>

    <main>
        <section>
            <h2>Agendar consulta</h2>

            <form id="formAgendamento">

                <label for="medico">Médico:</label>
                <select id="medico" required>
                    <option value="">Carregando médicos...</option>
                </select>

                <label for="horario">Horário disponível:</label>
                <select id="horario" required>
                    <option value="">Selecione um médico primeiro</option>
                </select>

                <button type="submit">Confirmar agendamento</button>

            </form>

            <p id="mensagemAgendamento"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Agenda Cidade</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
