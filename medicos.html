<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisar Médicos - Agenda Cidade</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

    <header>
        <h1>Agenda Cidade</h1>
        <p>Sistema de Agendamento de Consultas</p>
    </header>

    <main>
        <section>
            <h2>Pesquisar médicos</h2>

            <form>
                <label for="especialidade">Especialidade:</label>
                <input
                    type="text"
                    id="especialidade"
                    placeholder="Digite a especialidade"
                >

                <button type="submit">Pesquisar</button>
            </form>

            <div>
                <h3>Médicos disponíveis</h3>

                <p>Dr. João Silva - Clínico Geral</p>
                <p>Dra. Maria Santos - Cardiologia</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Agenda Cidade</p>
    </footer>

</body>
</html>
